<style>:root{--bg:#dfe5ee;--paper:#f4f6fa;--card:#fff;--ink:#1f2937;--mu:#6b7280;--line:#e3e7ee;--navy:#1e2a4a;--navy2:#2c3d6b;--gold:#f5b700;--blue:#3b82f6;--blue2:#2563eb;--green:#22c55e;--green2:#15803d;--red:#ef4444;--amber:#b7791f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 500px at 50% -100px,#34487d 0,#141c33 70%) fixed;color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:11px 12px;font-weight:700;color:#fff;background:linear-gradient(180deg,#4f94f7,var(--blue2));transition:transform .1s,filter .15s}
button:active{transform:scale(.96);filter:brightness(.92)}
button:disabled{opacity:.4;cursor:default}
button.s{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.d{background:#fff1f1;color:#b91c1c;border:1px solid #f5c2c2}

.fw{width:100%;margin-top:8px}
input,select{width:100%;background:#fff;color:var(--ink);border:1px solid #cfd6e2;border-radius:12px;padding:10px;margin:4px 0}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--paper);overflow:hidden;box-shadow:0 0 60px #0008}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- menu ---------- */
#menu{background:radial-gradient(700px 420px at 50% -80px,#3a4f8c 0,#141c33 75%);color:#fff;overflow:auto}
.mw{padding:calc(28px + env(safe-area-inset-top)) 18px 28px;text-align:center}
.logo{font-size:64px;filter:drop-shadow(0 6px 18px #f5b70066)}
.mw h1{margin:6px 0 4px;font-size:34px;line-height:1.05;letter-spacing:-1px;color:var(--gold)}
.tag{color:#c9d3ea;margin:0 0 18px}
.big{width:100%;padding:16px;font-size:17px;margin:10px 0;border-radius:14px;box-shadow:0 8px 26px #0005}
.big small{display:block;font-weight:500;opacity:.9;font-size:12px;margin-top:2px}
.mc2{background:#ffffff12;border:1px solid #ffffff22;border-radius:18px;padding:14px;text-align:left;margin-top:10px}
.mc2 h3{margin:0 0 6px;color:#fff}

.dc{background:#ffffff0f;border:2px solid #ffffff22;border-radius:14px;padding:10px 12px;margin:8px 0;cursor:pointer}
.dc b{display:block;font-size:16px}.dc span{display:block;color:#c9d3ea;font-size:13px;margin-top:2px}.dc small{display:block;color:var(--gold);margin-top:4px;font-weight:600}
.dc.on{border-color:var(--gold);background:#f5b70022}
.ft{color:#8e9ac0;font-size:12px;margin-top:16px}

/* ---------- jogo ---------- */
#hd{background:linear-gradient(160deg,var(--navy2),var(--navy));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;box-shadow:0 4px 18px #0004;z-index:2}

.av{width:44px;height:44px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;font-size:26px}
.who{flex:1;min-width:0}.who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:#c3cde8;font-size:11.5px}
.hb{display:flex;gap:4px}
.ic{width:34px;height:34px;padding:0;font-size:17px;background:#ffffff1f;border:0;color:#fff;border-radius:12px}

.nw{font-size:30px;font-weight:850;color:var(--gold);letter-spacing:-1px;line-height:1.1}
.sp{width:100%;height:30px;margin:2px 0}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp div{background:#ffffff14;border-radius:10px;padding:6px 8px}

#feed{flex:1;overflow:auto;padding:8px 12px 18px;background:var(--paper)}

.fe.good{border-left-color:var(--green)}
.empty{color:var(--mu);text-align:center;margin-top:40px}

#ft{background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:2;box-shadow:0 -4px 16px #0001}
.sbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:2px 6px 4px}
.sb{font-size:11px;color:var(--mu)}.sb .l{display:flex;justify-content:space-between}.sb b{color:var(--ink)}

.nv{display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr 1fr;align-items:end}

/* ---------- folhas e modais ---------- */
.sheet{position:absolute;inset:0;z-index:20}
.bd{position:absolute;inset:0;background:#0b1226aa}
.pn{position:absolute;left:0;right:0;bottom:0;height:90%;background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;box-shadow:0 -10px 40px #0006}

.pb{flex:1;overflow:auto;padding:10px 12px calc(24px + env(safe-area-inset-bottom))}

.ev{border-left:4px solid var(--gold);background:linear-gradient(90deg,#fff9e6,#fff)}

details summary{cursor:pointer;font-weight:700;color:var(--blue2);margin-top:8px}

.tick{margin-top:6px;font-size:12px;background:#ffffff14;border-radius:10px;padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#e6ecff}
.paper{background:#fbf7ee;border:1px solid #d9cfb8;border-radius:12px;padding:14px;margin:8px 0;box-shadow:0 2px 8px #0002;font-family:Georgia,"Times New Roman",serif}
.mast{text-align:center;font-weight:900;letter-spacing:.08em;font-size:15px;border-bottom:3px double #6b5d3e;padding-bottom:6px;color:#2b2415}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}

</style>

function advance(n){if(game.dead)return;if(game.pending!==null)return toast("Decida o acontecimento antes de avançar.");const w0=netWorth(),m0=game.money+game.bank;let steps=0,stop=null;

function rollEvent(){if(game.pending!==null||game.legal.prison||game.crimex.fug>0||rnd()>.6)return;const rich=netWorth()>2e7,l=EVS.map((e,i)=>i).filter(i=>EVS[i].ok()&&!(rich&&EVS[i].small));if(l.length)game.pending=l[Math.floor(rnd()*l.length)]}
function decide(i){const e=EVS[game.pending];if(!e)return;const m=e.o[i][1]();game.pending=null;log((e.k?"📌 "+e.k+": ":"")+m,/perdeu|multa|Falhou|golpe|sumiu|quebrou|rastros|Não deu|chateado|culpa/i.test(m),/sucesso|Sucesso|certo|recebeu|devolveu|vendida|inesquecível/.test(m));fx();toast(m)}

function exportSave(){const b=new Blob([Engine.exportJSON(game)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="do-zero-ao-bilionario-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1e3);toast("Backup exportado.")}
function importSave(f){const r=new FileReader();r.onload=()=>{const m=Engine.importJSON(r.result);if(!m.ok)return toast("Backup recusado: "+m.err+" (jogo atual preservado).");askThen("Substituir o progresso atual por este backup?",()=>{locked=false;game=m.S;fx();toast("Backup importado.")})};r.readAsText(f)}
function save(){return locked?true:STORE.save(game).ok}

/* ---------- componentes ---------- */
const row=(k,v,c)=>`<div class="r"><span class="mu sm">${k}</span><b class="sm ${c||""}">${v}</b></div>`;
const btn=(a,i,t,x="",c="")=>`<button class="${c}" data-a="${a}" data-i="${i}" ${x}>${t}</button>`;
const opts=(list,cur)=>list.map(([v,t])=>`<option value="${v}" ${cur===v?"selected":""}>${t}</option>`).join("");
function spark(){const h=game.history.slice(-24).map(x=>x.worth);if(h.length<2)return"";const mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1,p=h.map((v,i)=>(i*280/(h.length-1)).toFixed(1)+","+(34-(v-mn)/r*30).toFixed(1)).join(" ");return`<svg viewBox="0 0 280 38" class="sp" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="#f5b700" stroke-width="2"/></svg>`}
function fx(){render();const e=$("cash");if(e){e.classList.remove("flash");void e.offsetWidth;e.classList.add("flash")}}

function newGame(){const d=DIFF.find(x=>x.id===pick)||DIFF[1],g=Engine.fresh();g.name=String(form.nm||"").trim().slice(0,32)||"Empreendedor";const r=Engine.C.setDifficulty(g,d.id);game=r.ok?r.S:g;game.events=[];if(d.cash>0)rec(d.cash,"Ajuda inicial da família","gift");game.pending=null;const j0=d.id==="dificil"?"delivery":"retail";game.job=j0;log("🍼 Sua história começa aos 18 anos. Dificuldade: "+d.name+".");log("💼 Você começou como "+JOBS.find(j=>j.id===j0).name.toLowerCase()+" ("+R$(JOBS.find(j=>j.id===j0).salary)+"/mês). Guarde dinheiro para abrir seu primeiro negócio!",0,1);if(d.cash>0)log("💵 Sua família ajuda com "+R$(d.cash)+" para você começar.",0,1);else log("💪 Você começa do zero absoluto. Boa sorte.");locked=false;alertS=null;askS=null;sheet=null;feedSig="";lastRank=0;ensureRivals();news("🗞️ "+game.name+", de 18 anos, começa a vida de empresário(a) do zero.","me");show("gm");fx()}
function continueGame(){const L=STORE.load();if(!L.ok||L.source==="novo jogo")return toast("⚠️ "+(L.err||"Nenhum save encontrado."));game=L.S;if(L.migrated)log("Progresso anterior migrado com segurança.");alertS=null;askS=null;sheet=null;feedSig="";lastRank=0;locked=false;ensureRivals();show("gm");fx()}
function toMenu(){sheet=null;game=null;renderMenu();show("menu")}

function renderFeed(){const sig=game.gen+"|"+game.events.length+"|"+(game.events[0]?game.events[0].text:"")+"|"+game.month;if(sig===feedSig)return;feedSig=sig;
let h="",last=null;for(const e of game.events.slice().reverse()){if(e.age!==last){h+=`<div class="yr">Idade: ${e.age}</div>`;last=e.age}h+=`<div class="fe ${e.bad?"bad":e.good?"good":""}">${esc(e.text)}</div>`}
const f=$("feed");f.innerHTML=h||'<p class="empty">Sua história começa agora.</p>';f.scrollTop=f.scrollHeight}
function renderFt(){const B=[["❤️","Saúde",game.health,"#ef4444"],["😊","Feliz",game.happiness,"#f59e0b"],["🧠","Mente",game.intel,"#3b82f6"],["⭐","Reput.",game.rep,"#8b5cf6"],["😰","Estresse",game.stress,"#f97316"]];
$("ft").innerHTML=`<div class="sbs">${B.map(b=>`<div class="sb"><div class="l"><span>${b[0]}</span><b>${Math.round(b[2])}</b></div><div class="bar"><i style="width:${b[2]}%;background:${b[3]}"></i></div></div>`).join("")}</div>
<nav class="nv"><button data-o="carreira"><span>💼</span>Carreira</button><button data-o="neg"><span>🏢</span>Empresas</button><button class="age" data-a="year" aria-label="Envelhecer um ano">+<small>ANO</small></button><button data-o="bens"><span>🚘</span>Bens</button><button data-o="vida"><span>💞</span>Vida</button><button data-o="menu"><span>⋯</span>Mais</button></nav>`}
const SHEETS={luxo:"💎 Luxo e hobbies",prisao:"🚔 Prisão",menu:"⋯ Menu",jornal:"📰 Jornal",crimes:"🕶️ Crimes",gov:"🏛️ Governo e política",fama:"⭐ Fama",metas:"🎯 Metas e ranking",carreira:"💼 Carreira",neg:"🏢 Empresas",bens:"🚘 Bens",vida:"💞 Vida e atividades",fin:"🏦 Finanças",justica:"⚖️ Justiça",mais:"☰ Mais"};
function renderSheet(){const s=$("sheet");if(!sheet){s.hidden=true;lastSheet=null;return}const old=lastSheet===sheet&&$("sb")?$("sb").scrollTop:0;s.hidden=false;
s.innerHTML=`<div class="bd" data-a="close"></div><div class="pn"><div class="ph"><b>${SHEETS[sheet]}</b><button class="ic x" data-a="close" aria-label="Fechar">✕</button></div><div class="pb" id="sb">${V[sheet]()}</div></div>`;$("sb").scrollTop=old;lastSheet=sheet}
function renderModal(){const m=$("modal");let h="";if(askS)h=`<div class="c ev"><h3>⚠️ Confirmar</h3><p>${esc(askS.msg)}</p>${askS.input?`<input id="askin" maxlength="36" value="${esc(askS.val||"")}">`:""}<div class="g2" style="margin-top:8px">${btn("askno",0,"Cancelar","","s")}${btn("askyes",0,"Confirmar","","d")}</div></div>`;else if(alertS)h=`<div class="c ev bad"><h3>${esc(alertS.t)}</h3><p>${esc(alertS.m)}</p>${btn("alertgo",0,alertS.gl,"","fw")}${btn("alertok",0,"Continuar","","s fw")}</div>`;else if(game.dead)h=V.morte();else if(game.pending!==null){const e=EVS[game.pending];if(e)h=`<div class="c ev"><h3>📌 Decisão importante</h3><p>${L(e.t)}</p>${e.o.map((o,i)=>btn("ev",i,L(o[0]),"",i?"s fw":"fw")).join("")}</div>`;else game.pending=null}
if(!h){m.hidden=true;return}m.hidden=false;m.innerHTML=`<div class="mc">${h}</div>`}
function render(){if(!game)return;checkAch();renderHd();renderFeed();renderFt();renderSheet();renderModal();if(!save())toast("⚠️ Não foi possível salvar neste navegador. Exporte um backup.")}
