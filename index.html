<style>:root{--bg:#dfe5ee;--paper:#f4f6fa;--card:#fff;--ink:#1f2937;--mu:#6b7280;--line:#e3e7ee;--navy:#1e2a4a;--navy2:#2c3d6b;--gold:#f5b700;--blue:#3b82f6;--blue2:#2563eb;--green:#22c55e;--green2:#15803d;--red:#ef4444;--amber:#b7791f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 500px at 50% -100px,#34487d 0,#141c33 70%) fixed;color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:11px 12px;font-weight:700;color:#fff;background:linear-gradient(180deg,#4f94f7,var(--blue2));transition:transform .1s,filter .15s}
button:active{transform:scale(.96);filter:brightness(.92)}
button:disabled{opacity:.4;cursor:default}
button.s{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.d{background:#fff1f1;color:#b91c1c;border:1px solid #f5c2c2}
button.g{background:linear-gradient(180deg,#4ade80,var(--green2))}
.fw{width:100%;margin-top:8px}
input,select{width:100%;background:#fff;color:var(--ink);border:1px solid #cfd6e2;border-radius:12px;padding:10px;margin:4px 0}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--paper);overflow:hidden;box-shadow:0 0 60px #0008}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen[hidden],.sheet[hidden],.modal[hidden]{display:none}

/* ---------- menu ---------- */
#menu{background:radial-gradient(700px 420px at 50% -80px,#3a4f8c 0,#141c33 75%);color:#fff;overflow:auto}

.dc b{display:block;font-size:16px}.dc span{display:block;color:#c9d3ea;font-size:13px;margin-top:2px}.dc small{display:block;color:var(--gold);margin-top:4px;font-weight:600}
.dc.on{border-color:var(--gold);background:#f5b70022}
.ft{color:#8e9ac0;font-size:12px;margin-top:16px}

/* ---------- jogo ---------- */
#hd{background:linear-gradient(160deg,var(--navy2),var(--navy));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;box-shadow:0 4px 18px #0004;z-index:2}
.hrow{display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;font-size:26px}
.who{flex:1;min-width:0}.who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:#c3cde8;font-size:11.5px}
.hb{display:flex;gap:4px}
.ic{width:34px;height:34px;padding:0;font-size:17px;background:#ffffff1f;border:0;color:#fff;border-radius:12px}

#feed{flex:1;overflow:auto;padding:8px 12px 18px;background:var(--paper)}

#ft{background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:2;box-shadow:0 -4px 16px #0001}
.sbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:2px 6px 4px}
.sb{font-size:11px;color:var(--mu)}.sb .l{display:flex;justify-content:space-between}.sb b{color:var(--ink)}
.bar{height:6px;background:#e5e9f0;border-radius:9px;overflow:hidden;margin-top:2px}.bar i{display:block;height:100%;background:var(--blue);transition:width .5s}
.nv{display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr 1fr;align-items:end}

/* ---------- folhas e modais ---------- */
.sheet{position:absolute;inset:0;z-index:20}
.bd{position:absolute;inset:0;background:#0b1226aa}
.pn{position:absolute;left:0;right:0;bottom:0;height:90%;background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;box-shadow:0 -10px 40px #0006}

.sm{font-size:12.5px}.mu{color:var(--mu)}.ok{color:#15803d}.bad{color:#dc2626}.gd{color:var(--amber)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}

.vit{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 2px}

.nv{grid-template-columns:1fr 1fr 92px 1fr 1fr 1fr}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}

.call .who{font-weight:700;margin:4px 0}.call .cb{margin-top:6px}
.bub{background:#e5e7eb;color:#111827;border-radius:14px;padding:9px 12px;margin:8px 0;font-size:14px}
.bub.me{background:#dbeafe;margin-left:24px}.bub.good{background:#bbf7d0;color:#14532d}.bub.bad{background:#fecaca;color:#7f1d1d}.bub.mid{background:#fef3c7;color:#78350f}

.av{overflow:hidden;font-size:0}.av svg{width:100%;height:100%;display:block}
.avp{width:130px;height:130px;margin:6px auto;border-radius:50%;background:#e0e7ff;overflow:hidden}.avp svg{width:100%;height:100%}

.avd summary{cursor:pointer;font-weight:600;margin:8px 0}

.fc2{background:#f8fafc;margin:8px 0}

.mav{display:inline-block;width:34px;height:34px;vertical-align:middle;border-radius:50%;overflow:hidden;background:#e0e7ff;margin-right:4px}.mav svg,.tav svg{width:100%;height:100%;display:block}.dead{filter:grayscale(1);opacity:.65}
.trow{margin:10px 0}.tl{font-size:11px;font-weight:700;text-transform:uppercase;color:#64748b;margin-bottom:4px}.tr{display:flex;gap:8px;overflow-x:auto;align-items:flex-start;padding-bottom:4px}
.tn{flex:0 0 74px;text-align:center;font-size:11px}.tn b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tn small{display:block;color:#64748b;line-height:1.2}.tav{width:56px;height:56px;margin:0 auto 2px;border-radius:50%;overflow:hidden;background:#e0e7ff}.tn.me .tav{box-shadow:0 0 0 3px #6366f1}.th{align-self:center;color:#ec4899}
.sws{flex-wrap:wrap}.stp{display:flex;align-items:center;gap:8px;margin:4px 0}.stp button{flex:0 0 44px}.stp span{flex:1;text-align:center;line-height:1.2}.stp span b{display:block;font-size:14px}.stp span small{color:#64748b}
.journey{border-left:4px solid #6366f1}.jdots{display:flex;gap:6px;margin:8px 0}.jdots span{flex:1;text-align:center;font-size:12px;padding:3px 0;border-radius:8px;background:#e5e7eb;color:#6b7280}.jdots .ok{background:#16a34a;color:#fff}.jdots .cur{background:#6366f1;color:#fff}.js p{margin:4px 0}
.avstick{position:sticky;top:0;z-index:6;padding:2px 0 6px;background:var(--paper);margin:0 -2px}#menu .avstick{background:#1b2547}.avstick .avp{width:112px;height:112px;margin:2px auto 6px}
</style>

 function sha(s){

   return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){

  } return Promise.resolve("");
 }

const lc=lavCap(),L2=game.legal;
h+=`<div class="c"><h3>👁️ Respeito e medo</h3>${row("Respeito no submundo",Math.round(game.crimex.res||0)+"/100")}<div class="bar"><i style="width:${game.crimex.res||0}%;background:#8b5cf6"></i></div><p class="mu sm">Cresce com os crimes e cai 2 por ano (e 25 se você delatar). Contatos e propinas ficam até 30% mais baratos e a fuga fica mais fácil, mas acima de 50 sua reputação perde 1 ponto por ano e eleições ficam mais difíceis.</p></div>

<div class="c"><h3>🏆 Guerra com rivais</h3><p class="mu sm">Denuncie um rival do ranking para derrubá-lo. Se for rastreado até você, o tiro sai pela culatra.</p>${game.rivals.map((r,i)=>`<div class="r"><span class="sm">${esc(r.name)}<br><span class="mu">${short(r.nw)}${r.st?" • "+(r.st==="preso"?"preso":"investigado"):""}</span></span>${btn("denun",i,"Denunciar ≈ "+short(unit()*2),r.st?"disabled":"","d")}</div>`).join("")}</div>`;
h+=`<div class="c"><h3>🏛️ Crimes políticos</h3><p class="mu sm">Propina a políticos e desvio de verba pública ficam na aba de governo.</p><button class="s fw" data-o="gov">🏛️ Governo e política</button></div>`;

return h+`<div class="c"><h3>📚 Antecedentes</h3>${L.record.map(r=>row(r.age+" anos • "+esc(r.type),r.months?r.months+" m de prisão":"multa "+R$(r.fine))).join("")||'<p class="mu">Ficha limpa.</p>'}</div>`},
morte(){const d=game.dead,o=obit();return`<div class="c ev bad"><div class="paper"><div class="mast">O DIÁRIO DO MERCADO • OBITUÁRIO</div><div class="mdate">${MN[d.month%12]} • ${d.age} anos</div><div class="hl">${esc(o.head)}</div></div>${o.P.map(x=>`<p class="sm">${esc(x)}</p>`).join("")}${row("Causa",esc(d.cause))}${row("Dívidas",R$(game.debt+game.arrears),"bad")}${row("Título de legado",legacy().title)}${row("Pontos de legado",legacy().pts)}${row("Missões cumpridas",game.missions.length+"/"+MISS.length)}${row("Posição no ranking","Nº "+rankOf())}${taxHtml()}<p class="mu sm">Dívidas são pagas com o caixa do espólio; o que sobrar, depois do imposto e do testamento, vira herança. Empresas, imóveis, veículos e carteira passam ao herdeiro, que começa com reputação reduzida e sem antecedentes. Este obituário fica salvo no Arquivo do jornal.</p>${heirBlock()}${btn("tomenu",0,"🏠 Voltar ao menu","","s fw")}</div>`},

<div class="c"><h3>📈 Evolução do patrimônio</h3>${game.history.slice(-8).map(x=>row(x.age+" anos",R$(x.worth))).join("")||'<p class="mu">Avance o tempo para registrar.</p>'}</div>

<div class="c"><h3>💾 Dados</h3><div class="g2">${btn("exp",0,"Exportar backup","","s")}${btn("imp",0,"Importar backup","","s")}</div><input type="file" id="fi" accept=".json" hidden>${btn("tomenu",0,"🏠 Voltar ao menu","","s fw")}${btn("reset",0,"Apagar progresso","","d fw")}<p class="mu sm">Salvo neste navegador, funciona offline. Uma cópia de segurança do save anterior é mantida automaticamente.</p></div>`}};

bgift:(i,x,y)=>bigGift(i==="pt"?{t:"pt"}:{t:"lov",i:+y}),

else{if(f.fv===g.age)return toast("Vocês já viajaram juntos este ano.");const c=Math.round(tripCost()*1.5);if(g.money+g.bank<c)return toast("Dinheiro insuficiente ("+R$(c)+").");if(!act())return;pay(c,"Férias em família");f.fv=g.age;g.kids.forEach(k=>k.bd=clamp(k.bd+8,0,100));if(g.pt)adjLove(10);g.happiness=clamp(g.happiness+6,0,100);g.stress=clamp(g.stress-10,0,100);log("🏖️ Férias em família. Filhos +8, estresse -10.",0,1);flog("🏖️ Férias em família.");fx()}},

exact:i=>{const g=game,e=g.fam.ex[+i];if(!e)return;if(g.partner)return toast("Você já tem um relacionamento.");if(!act())return;if(rnd()<clamp(e.love/100*.7+.15,.1,.8)){g.fam.ex.splice(+i,1);g.partner=true;g.relationship="Namorando";g.pt={n:e.n,p:e.p,love:50,age:e.age,job:e.job,tk:-1,lv:false,ng:false,pn:false,tr:-1,th:-1,h:70,gf:[]};g.happiness=clamp(g.happiness+8,0,100);log("💞 Você e "+e.n+" reataram!",0,1);flog("💞 Reatou com "+e.n+".")}else{e.love=clamp(e.love-15,0,100);log("💔 "+e.n+" não quis voltar.",1)}fx()},
